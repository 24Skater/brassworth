name: Bug report
description: Something does not work the way it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. The single most useful thing you can tell us is
        **which mode you were running**, because local-first and server mode share
        screens but almost no plumbing.

        If this is a security vulnerability, please do not file it here. Use the
        Security tab and choose "Report a vulnerability" instead.

  - type: dropdown
    id: mode
    attributes:
      label: Which mode?
      options:
        - Local-first (the default, no server)
        - Local-first with IndexedDB (VITE_STORAGE_PROVIDER=indexeddb)
        - Self-hosted server (Docker)
        - Self-hosted server (npm run start:server)
        - Not sure
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you saw, and what you expected instead.
      placeholder: |
        I checked out the impact driver to a neighbour with a due date of last
        Tuesday. The dashboard says nothing is overdue.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered, starting from a fresh state if you can.
      placeholder: |
        1. Create a property and add one item
        2. Open the item and record a "Loaned out" event with a past due date
        3. Go to the dashboard
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: From `package.json`, or the commit you are on.
      placeholder: "2.0.0"

  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: "Firefox 130 on Windows 11"

  - type: textarea
    id: console
    attributes:
      label: Console or container output
      description: Browser console for local-first, `docker compose logs brassworth` for server mode. Optional, but it often contains the answer.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Before you file
      options:
        - label: I checked the [FAQ](https://github.com/24Skater/brassworth/blob/main/docs/FAQ.md) and existing issues.
          required: true
        - label: This is not a security vulnerability. (Those go through the Security tab.)
          required: true
