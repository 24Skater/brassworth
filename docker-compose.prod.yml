version: '3.8'

# Production docker-compose with nginx reverse proxy and SSL
# Usage: docker-compose -f docker-compose.prod.yml up -d

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brassworth-frontend
    restart: unless-stopped
    networks:
      - brassworth-network
    labels:
      - "com.brassworth.description=Brassworth Frontend"
      - "com.brassworth.version=0.0.0"

  nginx:
    image: nginx:alpine
    container_name: brassworth-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    restart: unless-stopped
    depends_on:
      - frontend
    networks:
      - brassworth-network
    labels:
      - "com.brassworth.description=Brassworth Nginx Reverse Proxy"

networks:
  brassworth-network:
    driver: bridge

