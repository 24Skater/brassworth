# Brassworth, self-hosted.
#
#   docker compose up -d
#
# That is the whole thing. SQLite on a volume, no external database, no reverse
# proxy required. Point a proxy at port 3000 when you want HTTPS, and set
# NODE_ENV=production so the session cookie is marked Secure.

services:
  brassworth:
    build: .
    image: brassworth:latest
    container_name: brassworth
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/app/data/brassworth.db
      # How long a session lasts before it has to be renewed.
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}

      # --- Optional: sign in through an identity provider ---
      # Leave these unset for local accounts only. All four are required
      # together; the sign-in route reports itself unavailable without them.
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_LABEL: ${OIDC_LABEL:-}
      OIDC_PROVIDER: ${OIDC_PROVIDER:-}
    volumes:
      # Your data. Without this, it dies with the container.
      - brassworth-data:/app/data

volumes:
  brassworth-data:
